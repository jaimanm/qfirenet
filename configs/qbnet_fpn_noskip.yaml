# QB-Net FPN-UNet — no-skip ablation
#
# Identical to qbnet_fpn.yaml but with the encoder skip connections (FPN
# laterals l1-l4) severed via `skip_connections: false`. Only the quantum
# bottleneck lateral (l5, from the QB-Net-processed x5) feeds the top-down
# decoder, so the decoder must reconstruct the full-resolution segmentation
# from the quantum bottleneck alone.
#
# Purpose: compared against qbnet_fpn (skips ON), this isolates how much the
# QB-Net bottleneck is actually contributing. If performance holds up without
# skips, the model genuinely uses the bottleneck; if it collapses, the FPN was
# leaning on encoder skips and routing around the quantum module.
#
# Runtime note:
#   QBNetBottleneck evaluates the circuit per spatial location, so each forward
#   runs B·H·W circuits (batch_size · 32 · 32 at the bottleneck).

model: qbnet_fpn
mode: 4                          # swir (SWIR-only, 3 channels — matches qbnet_fpn)
n_classes: 2

# Ablation: sever encoder skip connections (laterals l1-l4); keep bottleneck l5
skip_connections: false

# Quantum bottleneck (same as qbnet_fpn)
n_qubits: 4                      # matching qbnet.yaml for a controlled comparison
n_layers: 2                      # trainable U3 layers inside QB-Net
circuit: qbnet_circuit

# Training
epochs: 35
batch_size: 16                   # matches qbnet_fpn
test_batch_size: 16
val_batch_size: 1
learning_rate: 1.0e-4
weight_decay: 5.0e-4
seed: 1234

# Loss
loss: cross_entropy
fire_class_weight: 10

# FPN
fpn_out_channels: 128            # matches qbnet_fpn

# Data
data_dir: ../Sen2Fire/
train_list: ./dataset/train.txt
val_list:   ./dataset/val.txt
test_list:  ./dataset/test.txt

# Random patch-level split (same as qbnet_fpn for fair comparison)
random_split: true
random_split_train_ratio: 0.70
random_split_val_ratio:   0.15

# Output
experiment_name: qbnet_fpn_noskip
